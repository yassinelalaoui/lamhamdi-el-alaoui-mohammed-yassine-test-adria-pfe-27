server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: account-service-rest
          uri: lb://account-service
          predicates:
            - Path=/api/accounts/**
        - id: transaction-service-rest
          uri: lb://transaction-service
          predicates:
            - Path=/api/transactions/**
        - id: ai-assistant-rest
          uri: lb://ai-assistant
          predicates:
            - Path=/api/chat/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
