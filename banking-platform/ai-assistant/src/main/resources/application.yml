server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: ai-assistant

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
